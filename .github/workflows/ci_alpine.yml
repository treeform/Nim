name: Alpine Linux 64-bit

on:
  push:
    branches: [devel, 'alpine-*', nim-alpine]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Alpine 64-bit (${{ matrix.cpu }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            cpu: amd64
          - runner: ubuntu-24.04-arm
            cpu: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap and test on musl
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            alpine:3.23 sh -ec '
              apk add --no-cache bash build-base clang git
              bash ci/alpine.sh
            '
